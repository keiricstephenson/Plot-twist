<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#7a1645"/><stop offset=".55" stop-color="#3a0b2a"/><stop offset="1" stop-color="#14050f"/>
    </radialGradient>
    <linearGradient id="film" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe17a"/><stop offset=".5" stop-color="#ffb52e"/><stop offset="1" stop-color="#ff7a2e"/>
    </linearGradient>
    <linearGradient id="filmBack" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d98a1f"/><stop offset="1" stop-color="#a8501a"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <!-- the two halves of the loop; each is an S through the centre -->
    <path id="under" d="M436 256 C 436 346, 320 350, 256 256 C 192 162, 76 166, 76 256"/>
    <path id="over"  d="M76 256 C 76 346, 192 350, 256 256 C 320 162, 436 166, 436 256"/>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- spotlight glow -->
  <ellipse cx="256" cy="256" rx="200" ry="120" fill="#ffb52e" opacity=".18" filter="url(#soft)"/>

  <!-- strand underneath (back of the film, a bit darker) -->
  <g fill="none" stroke-linecap="butt">
    <use href="#under" stroke="url(#filmBack)" stroke-width="78"/>
    <use href="#under" stroke="#2a0a1c" stroke-width="64" stroke-dasharray="9 13"/>
    <use href="#under" stroke="url(#filmBack)" stroke-width="46"/>
    <use href="#under" stroke="#3a1020" stroke-width="38"/>
    <use href="#under" stroke="url(#filmBack)" stroke-width="38" stroke-dasharray="4 30" opacity=".9"/>
  </g>
  <!-- shadow cast by the top strand -->
  <use href="#over" fill="none" stroke="#000" stroke-width="84" opacity=".55" filter="url(#shadow)"/>
  <!-- strand on top (front of the film, bright) -->
  <g fill="none" stroke-linecap="butt">
    <use href="#over" stroke="url(#film)" stroke-width="78"/>
    <use href="#over" stroke="#3a0b2a" stroke-width="64" stroke-dasharray="9 13"/>
    <use href="#over" stroke="url(#film)" stroke-width="46"/>
    <use href="#over" stroke="#4a1530" stroke-width="38"/>
    <use href="#over" stroke="url(#film)" stroke-width="38" stroke-dasharray="4 30"/>
  </g>
  <!-- sparkle -->
  <path d="M412 72 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z" fill="#fff4cf"/>
  <path d="M98 412 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" fill="#fff4cf" opacity=".8"/>
</svg>
