<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f2533"/><stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ffd23d"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- film strip perforations top & bottom -->
  <g fill="#ffffff" opacity=".10">
    <rect x="0" y="34" width="512" height="44"/><rect x="0" y="434" width="512" height="44"/>
  </g>
  <g fill="#0b0d12" opacity=".9">
    <rect x="22" y="46" width="34" height="20" rx="5"/><rect x="92" y="46" width="34" height="20" rx="5"/><rect x="162" y="46" width="34" height="20" rx="5"/><rect x="232" y="46" width="34" height="20" rx="5"/><rect x="302" y="46" width="34" height="20" rx="5"/><rect x="372" y="46" width="34" height="20" rx="5"/><rect x="442" y="46" width="34" height="20" rx="5"/>
    <rect x="22" y="446" width="34" height="20" rx="5"/><rect x="92" y="446" width="34" height="20" rx="5"/><rect x="162" y="446" width="34" height="20" rx="5"/><rect x="232" y="446" width="34" height="20" rx="5"/><rect x="302" y="446" width="34" height="20" rx="5"/><rect x="372" y="446" width="34" height="20" rx="5"/><rect x="442" y="446" width="34" height="20" rx="5"/>
  </g>
  <!-- the route forms a P, with an arrow at each end -->
  <g transform="translate(-14,-8)" filter="url(#glow)" fill="none" stroke="url(#gold)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M200 392 L200 140 Q200 122 218 122 L290 122 A80 80 0 0 1 290 282 L240 282"/>
    <path d="M168 362 L200 396 L232 362"/>
    <path d="M268 250 L234 282 L268 314"/>
  </g>
</svg>
